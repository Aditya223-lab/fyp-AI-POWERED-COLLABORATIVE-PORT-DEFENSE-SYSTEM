spring.application.name=portdefense

# Secrets live in backend/.env (git-ignored), so they work the same whether you
# start the app from IntelliJ, from mvnw, or from a terminal that has no
# environment variables set. The file is optional — the app starts fine without
# it. See backend/.env.example for the format.
spring.config.import=optional:file:.env[.properties]

server.port=8080

# --- H2 file-backed DB (survives backend restart) ---
# AUTO_SERVER lets the H2 console attach while the app is running. The DB
# file lives in ./data/portdefense.mv.db relative to where Spring is launched
# (i.e. the backend/ folder when using mvnw).
spring.datasource.url=jdbc:h2:file:./data/portdefense;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=false

# --- Session / cookie hardening ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Flip to true once you serve over HTTPS in prod.
server.servlet.session.cookie.secure=false

# --- JWT bridge with the Next.js frontend ---
# MUST match the frontend's APP_JWT_SECRET (in frontend/client/.env.local).
# At least 32 chars. Override via APP_JWT_SECRET env var in production.
app.jwt.secret=${APP_JWT_SECRET:dev-only-shared-secret-change-me-please-32+chars}
app.jwt.ttl-seconds=1800

# --- Mail (Gmail SMTP) ---
# Sends from / to monabanther@gmail.com so you can read the app's mail there.
# Gmail SMTP needs an APP PASSWORD (NOT the account's login password):
#   1. Enable 2-Step Verification on monabanther@gmail.com
#   2. Google Account -> Security -> App passwords -> generate one for "Mail"
#   3. Supply the 16-char value (spaces removed) via the MAIL_PASSWORD env var,
#      e.g.  ! cd backend; $env:MAIL_PASSWORD="abcdefghijklmnop"; .\mvnw.cmd spring-boot:run
# Do NOT paste the app password here — this file is committed to git.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:monabanther@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# From: address (the Gmail account). Admin = inbox that receives contact-form
# and alert emails — set to the same account so everything lands in one place.
app.mail.from=${MAIL_FROM:monabanther@gmail.com}
app.mail.admin=${ADMIN_EMAIL:monabanther@gmail.com}

# Toggles. Contact form mail is on by default; alert mail is OFF by default so
# the simulator does not blast inbox during dev. Flip MAIL_ALERTS_ENABLED=true
# to receive a mail per critical/zero-day alert (still rate-limited by the
# existing 60-second per-source-IP cooldown).
app.mail.contact.enabled=${MAIL_CONTACT_ENABLED:true}
app.mail.alerts.enabled=${MAIL_ALERTS_ENABLED:false}

# --- Real-time asset monitor (AssetMonitorService) ---
# Probes every registered website/host for real: DNS lookup, HTTP request,
# TCP connect. Set app.monitor.enabled=false to stop all outbound probing.
app.monitor.enabled=${MONITOR_ENABLED:true}
# TCP connect timeout per port, and HTTP request timeout, in milliseconds.
app.monitor.connect-timeout-ms=2000
app.monitor.http-timeout-ms=6000
# Answers slower than this are UP but flagged DEGRADED.
app.monitor.slow-response-ms=2500
# Consecutive failed checks before the "asset unreachable" alert fires.
app.monitor.failures-before-alert=2
# Hard cap on ports probed per asset — this is an availability check, not a
# port sweep. Raising it turns the monitor into a scanner; don't, unless the
# hosts are yours and you mean it.
app.monitor.max-ports=64
# Warn this many days before a TLS certificate expires.
app.monitor.tls-warn-days=14

# --- VirusTotal malware scanning (/api/vt, frontend page /scan) ---
# Get a free API key at https://www.virustotal.com (Sign in -> your profile ->
# API key). Never paste it here — this file is committed. Pass it in when you
# start the backend instead:
#   $env:VIRUSTOTAL_API_KEY="<key>"; .\mvnw.cmd spring-boot:run
# With no key the endpoints report "not configured" and the UI explains how to
# set one, rather than failing mid-scan.
app.virustotal.api-key=${VIRUSTOTAL_API_KEY:}
app.virustotal.base-url=https://www.virustotal.com/api/v3
# The public API caps uploads at 32 MB and allows 4 requests/minute, 500/day.
app.virustotal.max-file-bytes=33554432
app.virustotal.requests-per-minute=4
# How long to wait for engines to finish after a first-time upload.
app.virustotal.poll-attempts=8
app.virustotal.poll-interval-ms=3000

# Uploads have to fit through Spring's multipart limits as well.
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=33MB

# --- Active response: block IPs at the host firewall (admin only) ---
# enabled  — turn the whole feature off (endpoints still exist, blocks refused).
# enforce  — when true, actually run netsh/iptables to add the rule; when false
#            the block is recorded but the firewall is untouched (safe for a
#            shared or graded machine, and for demoing without admin rights).
# Enforcing a block needs the backend to run as Administrator (Windows) or root
# (Linux). Without that, a block is saved as SIMULATED with an explanatory note
# rather than failing. The rule only affects THIS machine.
app.response.enabled=${RESPONSE_ENABLED:true}
app.response.enforce=${RESPONSE_ENFORCE:true}
app.response.command-timeout-ms=5000

# --- Jackson (Spring Boot 4 ships Jackson 3, dates are ISO by default) ---
spring.jackson.time-zone=UTC

# --- Logging ---
logging.level.org.hibernate.SQL=INFO
logging.level.com.example.portdefense=INFO

