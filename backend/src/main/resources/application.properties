spring.application.name=portdefense

server.port=8080

# --- H2 file-backed DB (survives backend restart) ---
# AUTO_SERVER lets the H2 console attach while the app is running. The DB
# file lives in ./data/portdefense.mv.db relative to where Spring is launched
# (i.e. the backend/ folder when using mvnw).
spring.datasource.url=jdbc:h2:file:./data/portdefense;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=false

# --- Session / cookie hardening ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Flip to true once you serve over HTTPS in prod.
server.servlet.session.cookie.secure=false

# --- JWT bridge with the Next.js frontend ---
# MUST match the frontend's APP_JWT_SECRET (in frontend/client/.env.local).
# At least 32 chars. Override via APP_JWT_SECRET env var in production.
app.jwt.secret=${APP_JWT_SECRET:dev-only-shared-secret-change-me-please-32+chars}
app.jwt.ttl-seconds=1800

# --- Mail (Gmail SMTP). Set env vars; defaults leave mail disabled. ---
# For Gmail: create an App Password at https://myaccount.google.com/apppasswords
# (you must have 2FA enabled to see this option).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# From: address (defaults to the SMTP username). Recipient for contact form
# and alert emails (defaults to a known dev address).
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@portdefense.local}}
app.mail.admin=${ADMIN_EMAIL:paudel.asal00@gmail.com}

# Toggles. Contact form mail is on by default; alert mail is OFF by default so
# the simulator does not blast inbox during dev. Flip MAIL_ALERTS_ENABLED=true
# to receive a mail per critical/zero-day alert (still rate-limited by the
# existing 60-second per-source-IP cooldown).
app.mail.contact.enabled=${MAIL_CONTACT_ENABLED:true}
app.mail.alerts.enabled=${MAIL_ALERTS_ENABLED:false}

# --- Jackson (Spring Boot 4 ships Jackson 3, dates are ISO by default) ---
spring.jackson.time-zone=UTC

# --- Logging ---
logging.level.org.hibernate.SQL=INFO
logging.level.com.example.portdefense=INFO

